# =============================================================================
# テスト・playground 共通の AWS 構成
#
# - moto（インメモリの擬似AWS）と、実際の AWS（CloudFormation、`--aws` 指定時）の両方でこの構成を作ります。
# - 各リソースの key は、他のリソースからの参照と、ゴールデンファイル内の ID 置き換え
#   （例: 実際の i-0a1b2c... を <i:web_01> と書く）に使います。
# - 構成を変えたら `uv run pytest --casebook-update` で期待出力を作り直し、差分を確認してください。
#
# 構成の全体像:
#   api.elbx-test.internal (A Alias) / app.elbx-test.internal (CNAME) ──> prod-web-alb
#   edge.elbx-test.internal (A Alias) ──> edge-ingress-nlb ──> prod-web-alb
#   prod-web-alb ──> EC2 (web / canary) / IP->EC2 / ECS Fargate / Lambda
#                └── /batch/* ──> NLB のノードの IP（ip TG） ──> batch-nlb ──> EC2 batch-worker-01
#   v6.elbx-test.internal (AAAA Alias) ──> v6-dualstack-alb ──> IPv6 の ip TG ──> EC2 v6-web-01 / IP だけ
#
#   IPv6 の部分（moto_only: true のリソースと、サブネットの ipv6_cidr）は moto だけで作ります。
#   実際の AWS では VPC の IPv6 CIDR を Amazon が割り当てるため、ここに書いた固定の IPv6 アドレス
#   （2001:db8::/32 は文書用のアドレス）では作れません。
#
#   ALB のターゲットに NLB を直接登録する方法（target_type: alb）は AWS にないため、
#   ALB -> NLB は「NLB のノードの IP を ALB の ip TG に登録する」形で表しています。
#   elbx はその IP の ENI の説明から NLB を特定し、NLB の中まで展開します。
#
# 外部公開の方針（実際の AWS で作るときのため。テストで自動チェックしています）:
#   - グローバル IP を持つもの（internet-facing またはデュアルスタックの ELB、ECS タスク、
#     IPv6 アドレスを持つ EC2）には必ず SG を付け、
#     SG のインバウンドは VPC 内（vpc_cidr / vpc_ipv6_cidr）からだけを許可する
#   - EC2 にはパブリック IP を付けない
#   - SG なしの NLB は SG で遮断できないため、internal にする
# =============================================================================

region: ap-northeast-1
vpc_cidr: 10.0.0.0/16
# 外部公開の方針のチェックで、SG の IPv6 の送信元が VPC 内かを判定するために使う（moto 用）
vpc_ipv6_cidr: 2001:db8:1::/56

# ipv6_cidr は moto 用。cidr と両方書くとデュアルスタック、ipv6_cidr だけだと IPv6 専用のサブネット
subnets:
  - key: public_1a
    name: public-subnet-1a
    az: ap-northeast-1a
    cidr: 10.0.1.0/24
    ipv6_cidr: 2001:db8:1:1::/64
  - key: public_1c
    name: public-subnet-1c
    az: ap-northeast-1c
    cidr: 10.0.2.0/24
    ipv6_cidr: 2001:db8:1:2::/64
  # IPv6 専用のサブネット（IPv4 の cidr を持たない）
  - key: v6only_1a
    name: v6only-subnet-1a
    az: ap-northeast-1a
    ipv6_cidr: 2001:db8:1:3::/64
    moto_only: true

# ingress の書き方:
#   protocol: tcp / udp / all、port: 443 または "80-8080"（all のときは省略）
#   送信元は cidr（IPv4）または ipv6（IPv6）。外部公開の方針により、VPC 内の CIDR だけを書く
security_groups:
  - key: alb_sg
    name: prod-alb-sg
    description: Allow HTTP and HTTPS traffic from VPC
    ingress:
      - { protocol: tcp, port: 443, cidr: 10.0.0.0/16, description: HTTPS from VPC }
      - { protocol: tcp, port: 80-8080, cidr: 10.0.0.0/16, description: HTTP range from VPC }
      - { protocol: all, cidr: 10.0.0.0/16, description: All VPC internal }
  # NLB 用の SG（NLB は 2023年8月から SG を付けられる。付けられるのは NLB の作成時のみ）
  - key: batch_nlb_sg
    name: batch-nlb-sg
    description: Allow batch traffic from the ALB
    ingress:
      - { protocol: tcp, port: 9090, cidr: 10.0.0.0/16, description: From ALB in VPC }
  # デュアルスタックの ALB 用の SG
  - key: v6_alb_sg
    name: v6-alb-sg
    description: Allow HTTP from VPC over IPv4 and IPv6
    moto_only: true
    ingress:
      - { protocol: tcp, port: 80, cidr: 10.0.0.0/16, description: HTTP from VPC }
      - { protocol: tcp, port: 80, ipv6: "2001:db8:1::/56", description: HTTP from VPC (IPv6) }

# 実際の AWS では、同じドメインの自己署名証明書を作って ACM にインポートします
certificates:
  - key: wildcard_cert
    domain_name: "*.elbx-test.internal"
    san: ["*.elbx-test.internal", elbx-test.internal]

# すべて security_groups の先頭（alb_sg）を付けて起動します。
# instance_type は moto 用です（実際の AWS では費用を抑えるため、すべて t4g.nano で起動します）
ec2_instances:
  - { key: web_01, name: web-prod-01, instance_type: t3.medium, subnet: public_1a, private_ip: 10.0.1.11 }
  - { key: web_02, name: web-prod-02, instance_type: t3.medium, subnet: public_1c, private_ip: 10.0.2.12 }
  - { key: canary_01, name: canary-prod-01, instance_type: t3.small, subnet: public_1a, private_ip: 10.0.1.21 }
  # どの ELB にも紐づかない orphan-unattached-tg にだけ登録される待機系
  - { key: standby_01, name: standby-prod-01, instance_type: t3.micro, subnet: public_1c, private_ip: 10.0.2.99 }
  - { key: batch_01, name: batch-worker-01, instance_type: t3.large, subnet: public_1a, private_ip: 10.0.1.71 }
  # デュアルスタックの EC2（ipv6_ips の IPv6 アドレスを ENI に割り当てる）
  - { key: v6_web_01, name: v6-web-01, instance_type: t3.small, subnet: public_1a, private_ip: 10.0.1.31,
      ipv6_ips: ["2001:db8:1:1::31"], moto_only: true }

lambda_functions:
  - key: auth_fn
    function_name: prod-auth-fn
    runtime: python3.12
    handler: index.handler
    description: Authentication Lambda behind ALB
    subnets: [public_1a, public_1c]
    security_groups: [alb_sg]

# Fargate サービス（タスクには security_groups の先頭の SG を付ける）。
# moto はタスクを起動しないため、ターゲットはサービス単位の情報で解決されます。
# 実際の AWS では、タスクの IP をサービスが TG に自動で登録します（下の ecs_ip_tg の ips は moto 用）。
ecs_clusters:
  - cluster_name: prod-ecs-cluster
    service_name: api-fargate-svc
    task_family: api-fargate-task
    container_name: api-container
    container_port: 9000
    subnet: public_1a
    target_group: ecs_ip_tg

# 登録するターゲットの書き方:
#   instances: [EC2 の key] / ips: [IP] / lambdas: [Lambda の key] / load_balancers: [ELB の key]
target_groups:
  - { key: web_tg, name: prod-web-tg, protocol: HTTP, port: 8080, target_type: instance,
      health_check_path: /healthz, instances: [web_01, web_02] }
  - { key: canary_tg, name: prod-canary-tg, protocol: HTTP, port: 8080, target_type: instance,
      health_check_path: /healthz, instances: [canary_01] }
  - { key: ip_tg, name: prod-ip-tg, protocol: HTTP, port: 9000, target_type: ip,
      health_check_path: /ping, ips: [10.0.1.11] }
  - { key: ecs_ip_tg, name: prod-ecs-tg, protocol: HTTP, port: 9000, target_type: ip,
      health_check_path: /ecs-health, ips: [10.0.1.60] }
  - { key: lambda_tg, name: prod-lambda-tg, target_type: lambda, lambdas: [auth_fn] }
  # alb タイプの TG のヘルスチェックは HTTP / HTTPS で行う（ALB のリスナーに対して行うため）
  - { key: alb_tg, name: nlb-to-alb-tg, protocol: TCP, port: 443, target_type: alb,
      health_check_protocol: HTTPS, health_check_path: /, load_balancers: [web_alb] }
  # ALB -> NLB: NLB のノードの IP（load_balancer_enis の batch_nlb_1a）を ip TG に登録する
  - { key: alb_to_nlb_tg, name: alb-to-nlb-tg, protocol: HTTP, port: 9090, target_type: ip,
      health_check_path: /, ips: [10.0.1.90] }
  - { key: batch_nlb_tg, name: batch-nlb-tg, protocol: TCP, port: 9090, target_type: instance,
      instances: [batch_01] }
  # IPv6 の ip TG（デュアルスタックの ELB からだけ使える）。
  #   2001:db8:1:1::31 は v6-web-01 の IPv6（ENI から EC2 を特定できる）、
  #   2001:db8:1:2::50 はどの ENI のものでもない IP（サブネットの IPv6 CIDR から AZ を特定する）
  #   2001:db8:1:3::50 は IPv6 専用サブネットの IP（IPv4 の CIDR がなくてもサブネットを特定する）
  - { key: v6_ip_tg, name: prod-v6-ip-tg, protocol: HTTP, port: 8080, target_type: ip,
      ip_address_type: ipv6, health_check_path: /healthz,
      ips: ["2001:db8:1:1::31", "2001:db8:1:2::50", "2001:db8:1:3::50"], moto_only: true }
  # どの ELB にも紐づかない TG
  - { key: orphan_tg, name: orphan-unattached-tg, protocol: HTTP, port: 80, target_type: instance,
      health_check_path: /, instances: [standby_01] }

# ELB の名前は 32 文字以内で、"internal-" で始めることはできません（AWS の制約）。
# ルールの書き方:
#   conditions: host-header / path-pattern / http-request-method / source-ip は値のリスト、
#               http-header は { name, values }、query-string は [{ key, value }]
#   action:     forward: TGのkey
#               forward_weighted: { TGのkey: 重み, ... }
#               redirect: { protocol, host, port, path, query, status_code }
#               fixed_response: { status_code, content_type, message_body }
load_balancers:
  # internet-facing（グローバル IP あり）。SG で VPC 内からだけを許可する
  - key: web_alb
    name: prod-web-alb
    type: application
    scheme: internet-facing
    subnets: [public_1a, public_1c]
    security_groups: [alb_sg]
    listeners:
      - protocol: HTTP
        port: 80
        default_action:
          redirect: { protocol: HTTPS, host: "#{host}", port: "443", path: "/#{path}",
                      query: "#{query}", status_code: HTTP_301 }
        rules:
          - priority: 10
            conditions: { path-pattern: [/health-http] }
            action: { forward: web_tg }

      - protocol: HTTPS
        port: 443
        ssl_policy: ELBSecurityPolicy-TLS13-1-2-2021-06
        certificate: wildcard_cert
        default_action: { forward: web_tg }
        rules:
          - priority: 10
            conditions:
              host-header: [api.elbx-test.internal]
              path-pattern: [/v1/*]
            action:
              forward_weighted: { web_tg: 90, canary_tg: 10 }
          - priority: 20
            conditions:
              http-header: { name: X-Env, values: [ip-direct] }
              http-request-method: [GET, POST]
              query-string: [{ key: mode, value: fast }]
              source-ip: [203.0.113.0/24]
            action: { forward: ip_tg }
          - priority: 25
            conditions: { path-pattern: [/ecs/*] }
            action: { forward: ecs_ip_tg }
          - priority: 28
            conditions: { path-pattern: [/auth/*] }
            action: { forward: lambda_tg }
          - priority: 29
            conditions: { path-pattern: [/batch/*] }
            action: { forward: alb_to_nlb_tg }
          - priority: 30
            conditions: { path-pattern: [/legacy/*] }
            action:
              redirect: { protocol: HTTPS, host: new.elbx-test.internal, port: "443", path: /modern,
                          status_code: HTTP_301 }
          - priority: 40
            conditions: { path-pattern: [/maintenance] }
            action:
              fixed_response: { status_code: "503", content_type: text/plain,
                                message_body: Under maintenance }

  # SG なしの NLB。SG で外部を遮断できないため internal にする
  - key: edge_nlb
    name: edge-ingress-nlb
    type: network
    scheme: internal
    subnets: [public_1a]
    listeners:
      - { protocol: TCP, port: 80, default_action: { forward: alb_tg } }
      - { protocol: TCP, port: 443, default_action: { forward: alb_tg } }

  # SG ありの NLB。ノードの IP は load_balancer_enis で固定する
  - key: batch_nlb
    name: batch-nlb
    type: network
    scheme: internal
    subnets: [public_1a]
    security_groups: [batch_nlb_sg]
    listeners:
      - { protocol: TCP, port: 9090, default_action: { forward: batch_nlb_tg } }

  # デュアルスタックの ALB。IPv6 の送信元だけを IPv6 の TG に転送し、それ以外は 403 を返す
  - key: v6_alb
    name: v6-dualstack-alb
    type: application
    scheme: internal
    ip_address_type: dualstack
    subnets: [public_1a, public_1c]
    security_groups: [v6_alb_sg]
    moto_only: true
    listeners:
      - protocol: HTTP
        port: 80
        default_action:
          fixed_response: { status_code: "403", content_type: text/plain,
                            message_body: IPv6 only }
        rules:
          - priority: 10
            conditions: { source-ip: ["2001:db8:1::/56"] }
            action: { forward: v6_ip_tg }

# ELB のノードの ENI
#   実際の AWS では ELB が各サブネットに ENI を自動で作り、説明は "ELB net/<NLB名>/<ID>" になります。
#   ENI には ELB に付けた SG が付きます。
#   - moto はこの ENI を作らないため、同じ説明・同じ SG の ENI を作って再現します。
#   - 実際の AWS では、internal NLB のノードの IP をこの private_ip に固定して作ります。
#   elbx は ip TG に登録された IP がこの ENI のものなら、説明から ELB を特定して中まで展開します。
load_balancer_enis:
  - { key: batch_nlb_1a, load_balancer: batch_nlb, subnet: public_1a, private_ip: 10.0.1.90 }

# alias_to / cname_to には ELB の key を書きます
# example.com などは AWS で予約されていて作れないため、実在しないドメインを VPC に関連付けた
# 非公開のホストゾーンで作ります（インターネットからは名前解決できない）
route53_zones:
  - name: elbx-test.internal
    private: true
    records:
      - { name: api.elbx-test.internal, type: A, alias_to: web_alb }
      - { name: app.elbx-test.internal, type: CNAME, cname_to: web_alb, ttl: 300 }
      - { name: edge.elbx-test.internal, type: A, alias_to: edge_nlb }
      - { name: v6.elbx-test.internal, type: AAAA, alias_to: v6_alb, moto_only: true }
